<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ousi's Day</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div class="glass-container">
        <header>
            <h1 class="glitch" data-text="OUSI.05.07">OUSI.05.07</h1>
            <div id="timer">00:00:00:00</div>
        </header>

        <section class="char-grid">
            <div class="char-box bubbles" onclick="trigger('bubbles')"></div>
            <div class="char-box catwoman" onclick="trigger('catwoman')"></div>
            <div class="char-box fluttershy" onclick="trigger('fluttershy')"></div>
        </section>

        <div class="interaction-area">
            <p id="dynamic-text">The Queen's Birthday is Approaching...</p>
            <button id="gift-btn">Claim Your Gift</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
